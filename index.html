<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5efe2">
  <title>Tarjeta interactiva: Ninja</title>
  <link rel="stylesheet" href="css/estilo.css">
  <script src="js/eventos.js" defer></script>
</head>
<body>
  <main class="contenedor">
    <p class="etiqueta">Electiva I · Ejercicio de eventos</p>
    <h1>Tarjeta interactiva</h1>

    <article class="tarjeta">
      <div class="ilustracion" aria-hidden="true">
        <div class="luna"></div>
        <div class="ninja">
          <div class="cabello"></div>
          <div class="rostro">
            <div class="banda"></div>
            <div class="ojos">
              <span class="ojo"></span>
              <span class="ojo"></span>
            </div>
            <div class="mascara"></div>
          </div>
          <div class="cuello"></div>
        </div>
        <span class="estrella estrella-uno">✦</span>
        <span class="estrella estrella-dos">✧</span>
      </div>

      <div class="contenido">
        <p class="rango">Ninja aprendiz</p>
        <h2 class="nombre">Akira</h2>
        <p class="descripcion">Entrena en silencio y protege a su equipo.</p>
        <p class="tecnica">Técnica: Paso silencioso</p>
        <p class="estado" aria-live="polite">Estado: modo aldea</p>
        <button class="boton" type="button">Activar modo sombra</button>
      </div>
    </article>

    <p class="nota">Haz clic en el botón para alternar el estado de la tarjeta.</p>
  </main>
</body>
</html>
